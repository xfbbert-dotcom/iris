[project]
name = "iris-ai-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "httpx>=0.27.0,<0.29.0",
  "pydantic>=2.9.0,<3.0.0",
  "uvicorn>=0.32.0,<0.33.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<10.0.0",
  "pytest-asyncio>=0.24.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
